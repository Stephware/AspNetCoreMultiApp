name: Build (.NET 10)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AspNetCoreMultiApp.sln

      - name: Build
        run: dotnet build AspNetCoreMultiApp.sln --configuration Release --no-restore
